name: Combine Metadata and Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  process-files:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Combine Metadata
        run: |
          jq -c -s 'reduce .[] as $item ({}; . * $item)' json/*.json > metadata.json

      - name: Generate Recent Preprints
        run: |
          jq '[to_entries[]] | sort_by(.value.submissionDate) | reverse | .[0:5] | from_entries' metadata.json > recent-preprints.json

      - name: Generate OAI-PMH XML
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > oai.xml
          echo '<OAI-PMH xmlns="http://www.openarchives.org/OAI/2.0/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.openarchives.org/OAI/2.0/ http://www.openarchives.org/OAI/2.0/OAI-PMH.xsd">' >> oai.xml
          echo "  <responseDate>$(date -u +"%Y-%m-%dT%H:%M:%SZ")</responseDate>" >> oai.xml
          echo '  <request verb="ListRecords" metadataPrefix="oai_dc">https://archive.gd.edu.kg/oai.xml</request>' >> oai.xml
          echo '  <ListRecords>' >> oai.xml
      
          jq -r '
            to_entries | map(
              .key as $id
              | .value as $entry
              | "<record>" +
                "<header>" +
                  "<identifier>oai:archive.gd.edu.kg:\($id)</identifier>" +
                  "<datestamp>\($entry.submissionDate | strptime("%Y%m%d%H%M%S") | strftime("%Y-%m-%dT%H:%M:%SZ"))</datestamp>" +
                "</header>" +
                "<metadata>" +
                  "<oai_dc:dc xmlns:oai_dc=\"http://www.openarchives.org/OAI/2.0/oai_dc/\" xmlns:dc=\"http://purl.org/dc/elements/1.1/\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"http://www.openarchives.org/OAI/2.0/oai_dc/ http://www.openarchives.org/OAI/2.0/oai_dc.xsd\">" +
                    "<dc:title>\($entry.title)</dc:title>" +
                    ($entry.author | map("<dc:creator>\(.firstName) \(.lastName)" + (if .orcid then " (ORCID: \(.orcid))" else "" end) + "</dc:creator>") | join("")) +
                    "<dc:description>\($entry.abstract)</dc:description>" +
                    "<dc:date>\($entry.submissionDate | strptime("%Y%m%d%H%M%S") | strftime("%Y-%m-%d"))</dc:date>" +
                    "<dc:subject>\($entry.subject)</dc:subject>" +
                    ($entry.keywords | map("<dc:subject>\(.)</dc:subject>") | join("")) +
                    "<dc:rights>\($entry.license)</dc:rights>" +
                    "<dc:identifier xsi:type=\"doi\">\($entry.doi)</dc:identifier>" +
                  "</oai_dc:dc>" +
                "</metadata>" +
                "</record>"
            ) | .[]
          ' metadata.json >> oai.xml
      
          echo '  </ListRecords>' >> oai.xml
          echo '</OAI-PMH>' >> oai.xml

      - name: Generate Sitemap
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          # Add root URL manually with priority 1
          echo '<url>' >> sitemap.xml
          echo "  <loc>https://archive.gd.edu.kg/</loc>" >> sitemap.xml
          echo "  <lastmod>$(date -u +"%Y-%m-%dT%H:%M:%S%:z")</lastmod>" >> sitemap.xml
          echo '  <priority>1</priority>' >> sitemap.xml
          echo '</url>' >> sitemap.xml
          
          # Add index.html from all subdirectories (excluding json, abs, pdf, and root index.html)
          find . -type f -name "index.html" ! -path "./json/*" ! -path "./abs/*" ! -path "./pdf/*" ! -path "./index.html" | while read file; do
            path=$(dirname "$file" | sed 's|^\./||')  # Remove leading ./
            url="https://archive.gd.edu.kg/${path}/"
            echo '<url>' >> sitemap.xml
            echo "  <loc>$url</loc>" >> sitemap.xml
            echo "  <lastmod>$(date -u +"%Y-%m-%dT%H:%M:%S%:z")</lastmod>" >> sitemap.xml
            echo '  <priority>0.8</priority>' >> sitemap.xml
            echo '</url>' >> sitemap.xml
          done

          # Process HTML files under /abs/YYYYMMDDHHMMSS/
          find abs/ -type f -name "*.html" | while read file; do
            dir=$(dirname "$file")
            base=$(basename "$file" .html)
            yyyymmddhhmmss=$(basename "$dir")

            if [[ "$base" == "index" ]]; then
              url="https://archive.gd.edu.kg/abs/$yyyymmddhhmmss/"
              priority="0.8"
            else
              url="https://archive.gd.edu.kg/abs/$yyyymmddhhmmss/$base"
              priority="0.64"
            fi

            echo '<url>' >> sitemap.xml
            echo "  <loc>$url</loc>" >> sitemap.xml
            echo "  <lastmod>$(date -u +"%Y-%m-%dT%H:%M:%S%:z")</lastmod>" >> sitemap.xml
            echo "  <priority>$priority</priority>" >> sitemap.xml
            echo '</url>' >> sitemap.xml
          done

          # Process PDF files under /pdf/YYYYMMDDHHMMSS/
          find pdf/ -type f -name "*.pdf" | while read file; do
            dir=$(dirname "$file")
            base=$(basename "$file" .pdf)
            yyyymmddhhmmss=$(basename "$dir")

            if [[ "$base" == "index" ]]; then
              url="https://archive.gd.edu.kg/pdf/$yyyymmddhhmmss/index.pdf"
              priority="0.8"
            else
              url="https://archive.gd.edu.kg/pdf/$yyyymmddhhmmss/$base.pdf"
              priority="0.64"
            fi

            echo '<url>' >> sitemap.xml
            echo "  <loc>$url</loc>" >> sitemap.xml
            echo "  <lastmod>$(date -u +"%Y-%m-%dT%H:%M:%S%:z")</lastmod>" >> sitemap.xml
            echo "  <priority>$priority</priority>" >> sitemap.xml
            echo '</url>' >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata.json sitemap.xml recent-preprints.json oai.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update metadata.json, sitemap.xml, recent-preprints.json, and oai.xml"
          git push
