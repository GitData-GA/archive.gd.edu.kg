name: Combine Metadata and Generate Sitemap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  process-files:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Combine Metadata
        run: |
          jq -c -s 'reduce .[] as $item ({}; . * $item)' json/*.json > metadata.json

      - name: Generate Recent Preprints
        run: |
          jq '[to_entries[]] | sort_by(.value.submissionDate) | reverse | .[0:5] | from_entries' metadata.json > recent-preprints.json

      - name: Generate Sitemap
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml

          # Add root URL manually with priority 1
          echo '<url>' >> sitemap.xml
          echo "  <loc>https://archive.gd.edu.kg/</loc>" >> sitemap.xml
          echo "  <lastmod>$(date -u +"%Y-%m-%dT%H:%M:%S%:z")</lastmod>" >> sitemap.xml
          echo '  <priority>1</priority>' >> sitemap.xml
          echo '</url>' >> sitemap.xml
          
          # Add index.html from all subdirectories (excluding json, abs, pdf, and root index.html)
          find . -type f -name "index.html" ! -path "./json/*" ! -path "./abs/*" ! -path "./pdf/*" ! -path "./index.html" | while read file; do
            path=$(dirname "$file" | sed 's|^\./||')  # Remove leading ./
            url="https://archive.gd.edu.kg/${path}/"
            echo '<url>' >> sitemap.xml
            echo "  <loc>$url</loc>" >> sitemap.xml
            echo "  <lastmod>$(date -u +"%Y-%m-%dT%H:%M:%S%:z")</lastmod>" >> sitemap.xml
            echo '  <priority>0.8</priority>' >> sitemap.xml
            echo '</url>' >> sitemap.xml
          done

          # Process HTML files under /abs/YYYYMMDDHHMMSS/
          find abs/ -type f -name "*.html" | while read file; do
            dir=$(dirname "$file")
            base=$(basename "$file" .html)
            yyyymmddhhmmss=$(basename "$dir")

            if [[ "$base" == "index" ]]; then
              url="https://archive.gd.edu.kg/abs/$yyyymmddhhmmss/"
              priority="0.8"
            else
              url="https://archive.gd.edu.kg/abs/$yyyymmddhhmmss/$base"
              priority="0.64"
            fi

            echo '<url>' >> sitemap.xml
            echo "  <loc>$url</loc>" >> sitemap.xml
            echo "  <lastmod>$(date -u +"%Y-%m-%dT%H:%M:%S%:z")</lastmod>" >> sitemap.xml
            echo "  <priority>$priority</priority>" >> sitemap.xml
            echo '</url>' >> sitemap.xml
          done

          # Process PDF files under /pdf/YYYYMMDDHHMMSS/
          find pdf/ -type f -name "*.pdf" | while read file; do
            dir=$(dirname "$file")
            base=$(basename "$file" .pdf)
            yyyymmddhhmmss=$(basename "$dir")

            if [[ "$base" == "index" ]]; then
              url="https://archive.gd.edu.kg/pdf/$yyyymmddhhmmss/index.pdf"
              priority="0.8"
            else
              url="https://archive.gd.edu.kg/pdf/$yyyymmddhhmmss/$base.pdf"
              priority="0.64"
            fi

            echo '<url>' >> sitemap.xml
            echo "  <loc>$url</loc>" >> sitemap.xml
            echo "  <lastmod>$(date -u +"%Y-%m-%dT%H:%M:%S%:z")</lastmod>" >> sitemap.xml
            echo "  <priority>$priority</priority>" >> sitemap.xml
            echo '</url>' >> sitemap.xml
          done

          echo '</urlset>' >> sitemap.xml

      - name: Generate OAI-PMH XML
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > oai.xml
          echo '<OAI-PMH xmlns="http://www.openarchives.org/OAI/2.0/">' >> oai.xml

          # Add Identify section
          echo '  <Identify>' >> oai.xml
          echo '    <repositoryName>GitData Archive</repositoryName>' >> oai.xml
          echo '    <baseURL>https://archive.gd.edu.kg/oai.xml</baseURL>' >> oai.xml
          echo '    <protocolVersion>2.0</protocolVersion>' >> oai.xml
          echo '    <adminEmail>admin@gd.edu.kg</adminEmail>' >> oai.xml
          echo '    <earliestDatestamp>2023-12-24</earliestDatestamp>' >> oai.xml
          echo '    <deletedRecord>no</deletedRecord>' >> oai.xml
          echo '  </Identify>' >> oai.xml

          # Add ListRecords section
          echo '  <ListRecords>' >> oai.xml

          jq -c 'to_entries[]' metadata.json | while read entry; do
            identifier=$(echo "$entry" | jq -r '.key')
            title=$(echo "$entry" | jq -r '.value.title')
            subject=$(echo "$entry" | jq -r '.value.subject')
            license=$(echo "$entry" | jq -r '.value.license')
            submissionDate=$(echo "$entry" | jq -r '.value.submissionDate')
            doi=$(echo "$entry" | jq -r '.value.doi')
            abstract=$(echo "$entry" | jq -r '.value.abstract')

            echo '    <record>' >> oai.xml
            echo '      <metadata>' >> oai.xml
            echo "        <identifier>$identifier</identifier>" >> oai.xml
            echo "        <title>$title</title>" >> oai.xml
            echo "        <subject>$subject</subject>" >> oai.xml
            echo "        <license>$license</license>" >> oai.xml
            echo "        <submissionDate>$submissionDate</submissionDate>" >> oai.xml
            echo "        <doi>$doi</doi>" >> oai.xml
            echo "        <abstract><![CDATA[$abstract]]></abstract>" >> oai.xml

            # Authors
            echo "        <authors>" >> oai.xml
            echo "$entry" | jq -c '.value.author[]' | while read author; do
              firstName=$(echo "$author" | jq -r '.firstName')
              lastName=$(echo "$author" | jq -r '.lastName')
              orcid=$(echo "$author" | jq -r '.orcid // empty')  # ORCID is optional

              echo "          <author>" >> oai.xml
              echo "            <firstName>$firstName</firstName>" >> oai.xml
              echo "            <lastName>$lastName</lastName>" >> oai.xml
              if [ -n "$orcid" ]; then
                echo "            <orcid>$orcid</orcid>" >> oai.xml
              fi
              echo "          </author>" >> oai.xml
            done
            echo "        </authors>" >> oai.xml

            echo '      </metadata>' >> oai.xml
            echo '    </record>' >> oai.xml
          done

          echo '  </ListRecords>' >> oai.xml
          echo '</OAI-PMH>' >> oai.xml

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata.json sitemap.xml recent-preprints.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update metadata.json, sitemap.xml, and recent-preprints.json"
          git push
